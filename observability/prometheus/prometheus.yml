global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: dashboard
    metrics_path: /metrics
    static_configs:
      - targets: ['dashboard:5000']
  - job_name: api_gateway
    static_configs:
      - targets: ['api_gateway:8000']
  - job_name: product_service
    static_configs:
      - targets: ['product_service:8001']
  - job_name: order_service
    static_configs:
      - targets: ['order_service:8002']
  - job_name: payment_service
    static_configs:
      - targets: ['payment_service:8003']
  - job_name: node_exporter
    static_configs:
      - targets: ['node-exporter:9100']
